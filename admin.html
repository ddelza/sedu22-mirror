<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>재과만(sedu22) 관리자 모드</title>
<script>(function(){try{var t=localStorage.getItem('sedu22_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --text: #1a1a1a; --text-muted: #888888;
    --border: #d0d6e2; --nav-bg: #1a3d7c; --nav-text: #d8e3ff; --accent: #1a3d7c; --accent-soft: #e6ebf5;
    --danger: #c0392b; --font-body: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  :root[data-theme="dark-navy"] { --bg:#1b1f27; --surface:#242a35; --text:#e8e9ec; --text-muted:#adb8c8; --border:#353d4a; --nav-bg:#141821; --nav-text:#b8c9ef; --accent:#7da3e8; --accent-soft:#2a3344; }

  body { font-family: var(--font-body); margin: 0; background: var(--bg); color: var(--text); }
  header { background: var(--nav-bg); color: var(--nav-text); padding: 12px 20px; display: flex; align-items: center; gap: 16px; }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  header a { color: var(--nav-text); opacity: 0.8; font-size: 13px; }
  main { max-width: 880px; margin: 0 auto; padding: 20px; }

  #gate { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 100; }
  #gate .box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 28px 32px; text-align: center; }
  #gate input { border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 6px; padding: 8px 12px; font-size: 14px; margin-top: 10px; font-family: inherit; }
  #gate button { margin-top: 10px; margin-left: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--nav-text); border-radius: 6px; padding: 8px 14px; cursor: pointer; font-size: 14px; font-family: inherit; }
  #gate .err { color: var(--danger); font-size: 12.5px; margin-top: 8px; min-height: 16px; }

  .search-bar { display: flex; gap: 8px; margin-bottom: 16px; }
  .search-bar input { flex: 1; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 6px; padding: 8px 12px; font-size: 14px; font-family: inherit; }
  .hint { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; }

  .post-row { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; margin-bottom: 10px; }
  .post-row .title { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  .post-row .meta { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
  .tag-chip { font-size: 11px; background: var(--accent-soft); color: var(--accent); padding: 2px 8px; border-radius: 10px; display: inline-flex; align-items: center; gap: 5px; margin: 0 4px 4px 0; }
  .tag-chip.unclassified { background: var(--border); color: var(--text-muted); }
  .add-tag-btn { border: 1px dashed var(--border); background: transparent; color: var(--text-muted); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px; font-family: inherit; }
  .add-tag-btn:hover { border-color: var(--accent); color: var(--accent); }

  .report-form { margin-top: 10px; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--accent-soft); display: flex; flex-direction: column; gap: 8px; }
  .report-form textarea, .report-form input[type="text"] { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 6px; padding: 7px 10px; font-size: 13px; font-family: inherit; width: 100%; }
  .report-form textarea { min-height: 46px; resize: vertical; }
  .report-form-actions { display: flex; gap: 8px; }
  .report-form-actions button { border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 12.5px; font-family: inherit; background: var(--surface); color: var(--text); }
  .report-form-actions button.submit { background: var(--accent); color: var(--nav-text); border-color: var(--accent); font-weight: 600; }
  .report-form-status { font-size: 12px; color: var(--text-muted); }
  .report-tabs { display: flex; gap: 6px; }
  .report-tab { flex: 1; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); border-radius: 6px; padding: 6px 8px; cursor: pointer; font-size: 12.5px; font-family: inherit; }
  .report-tab.active { background: var(--accent); color: var(--nav-text); border-color: var(--accent); font-weight: 600; }
  .report-picklist { max-height: 160px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); padding: 4px 8px; }
  .report-pick-item { display: flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 4px 2px; cursor: pointer; }
  .report-selected { font-size: 12px; color: var(--accent); }

  #pendingBox { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 20px; }
  #pendingBox h2 { font-size: 14px; margin: 0 0 8px; }
  #pendingBox .refresh-btn { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px; font-family: inherit; }

  .pending-card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .pending-meta { font-size: 11px; color: var(--text-muted); margin-bottom: 2px; }
  .pending-summary { font-size: 12.5px; margin: 4px 0 8px; }
  .pending-actions { display: flex; gap: 8px; }
  .pending-actions button { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px; font-family: inherit; }
  .pending-actions button:hover { border-color: var(--accent); color: var(--accent); }
  .post-title-btn, .pending-title-btn { background: none; border: none; padding: 0; margin: 0; text-align: left; font-weight: 600; font-size: 14px; color: var(--text); cursor: pointer; font-family: inherit; text-decoration: underline; text-decoration-color: transparent; }
  .post-title-btn:hover, .pending-title-btn:hover { text-decoration-color: var(--accent); color: var(--accent); }

  .modalBg { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; z-index: 90; }
  .modalBg.show { display: flex; }
  .modal { background: var(--surface); border-radius: 10px; padding: 24px; max-width: 760px; width: 100%; position: relative; }
  .modal .close { position: absolute; top: 16px; right: 16px; background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text-muted); }
  .modal .title { font-size: 18px; font-weight: 700; margin-bottom: 6px; padding-right: 30px; }
  .modal .meta { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
  .modal .content { font-size: 14px; line-height: 1.6; }
  .modal .content img { max-width: 100%; }
</style>
</head>
<body>

<div class="modalBg" id="modalBg"><div class="modal" id="modal"></div></div>

<div id="gate">
  <div class="box">
    <div>관리자 비밀번호</div>
    <input type="password" id="pwInput" placeholder="비밀번호">
    <button id="pwSubmit">입장</button>
    <div class="err" id="pwErr"></div>
  </div>
</div>

<header>
  <h1>재과만 관리자 모드</h1>
  <a href="explore.html">← 사이트로 돌아가기</a>
</header>

<main>
  <div id="pendingBox">
    <h2>미처리 제보/수정 <button class="refresh-btn" id="pendingRefresh">새로고침</button></h2>
    <div id="pendingContent">아직 불러오지 않음</div>
  </div>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="제목/게시판/태그로 검색...">
  </div>
  <div class="hint">여기서 하는 수정은 바로 사이트에 반영되지 않습니다 — "관리자수정" 큐에 쌓였다가 검토 후 일괄 반영됩니다.</div>
  <div id="results"></div>
  <div class="hint" id="resultCount"></div>
</main>

<script type="module">
// backend/Code.gs 배포 후 그 /exec URL로 교체할 것 (explore.html도 동일하게 맞춰야 함)
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzftNdV5EDrQDyDIof-lc4YBUznYMrFy0Ec9qX8VkVZzkM1TwDso6Uul24wGGFfdciT/exec';
const ADMIN_PASSWORD = 'sedu26ai'; // 화면 진입용 — 실제 저장은 서버(Code.gs)에서 다시 검증함

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function sanitize(html) {
  return (html || '').replace(/<script[\s\S]*?<\/script>/gi, '');
}

const CATEGORIES = {
  '과학교사 업무': { icon: '🧑‍🏫', topics: ['과학 행사', '과학실 관리', '동아리 운영', '교원연수', '학급운영', '세특작성', '생활지도', '영재교육'] },
  '스마트 수업도구': { icon: '💻', topics: ['MBL센서', '아두이노', '앱/프로그램', '생성형 AI 도구', 'AR/VR', '교육용 단말기(태블릿/크롬북)', '메이커/3D프린팅'] },
  '수업 방법론': { icon: '🧭', topics: ['거꾸로 교실', 'IB(개념기반학습)', '배움중심수업', '토론수업'] },
  '재과만 소식': { icon: '📣', topics: ['카페 운영 공지', '가입인사'] },
};
function tagLabel(t) {
  if (t.category && CATEGORIES[t.category]) return `${CATEGORIES[t.category].icon} ${t.topic}`;
  return t.unit;
}
function tagIsUnclassified(t) { return t.unit === '미분류'; }
function tagKey(t) { return JSON.stringify(t); }
// 태그 추가/오류 제보 폼 전용 라벨 — 단원 태그(최상위 분류가 2015/2022 개정교육과정)는
// 뒤에 "(연도)"를 붙여서 같은 단원명이 2015/2022 어느 쪽인지 목록에서 바로 구분되게 한다.
function reportTagLabel(t) {
  if (t.curriculumYear) return `${t.schoolLevel} · ${t.subject} · ${t.unit}(${t.curriculumYear})`;
  return tagLabel(t);
}

// ---------------- 비밀번호 게이트 ----------------
document.getElementById('pwSubmit').addEventListener('click', tryUnlock);
document.getElementById('pwInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') tryUnlock(); });
function tryUnlock() {
  const val = document.getElementById('pwInput').value;
  if (val === ADMIN_PASSWORD) {
    document.getElementById('gate').style.display = 'none';
    init();
  } else {
    document.getElementById('pwErr').textContent = '비밀번호가 틀렸습니다.';
  }
}

// ---------------- 게시글 미리보기 모달 ----------------
function openPostModal(postId) {
  const p = posts.find((x) => x.id === postId);
  const modal = document.getElementById('modal');
  if (!p) {
    modal.innerHTML = `<button class="close" id="modalClose">✕</button><div class="hint">이 글을 찾을 수 없어요 (postId: ${escapeHtml(postId)}). 삭제됐거나 데이터에 없을 수 있어요.</div>`;
  } else {
    const tagsHtml = (p.tags || []).map((t) => `<span class="tag-chip ${tagIsUnclassified(t)?'unclassified':''}">${escapeHtml(reportTagLabel(t))}</span>`).join(' ');
    modal.innerHTML = `
      <button class="close" id="modalClose">✕</button>
      <div class="title">${escapeHtml(p.title)}</div>
      <div class="meta">${escapeHtml(p.board)} · ${escapeHtml(p.author||'')} · ${escapeHtml(p.created)}${p.permlink ? ` · <a href="${escapeHtml(p.permlink)}" target="_blank" rel="noopener">원본 보기</a>` : ''}</div>
      <div style="margin-bottom:10px;">${tagsHtml}</div>
      <div class="content">${sanitize(p.contentHtml)}</div>
    `;
  }
  document.getElementById('modalBg').classList.add('show');
  document.getElementById('modalClose').addEventListener('click', closeModal);
}
function closeModal() { document.getElementById('modalBg').classList.remove('show'); }
document.getElementById('modalBg').addEventListener('click', (e) => { if (e.target.id === 'modalBg') closeModal(); });

// ---------------- 데이터 로드 + 검색 ----------------
let posts = [];
let ALL_TAGGABLE = [];
async function init() {
  const manifest = await (await fetch('site-data/manifest.json')).json();
  const boardPosts = await Promise.all(
    manifest.boards.map((b) => fetch(`site-data/${b.fldid}.json`).then((r) => r.json()))
  );
  posts = boardPosts.flat();
  for (const p of posts) {
    const tagsText = p.tags ? p.tags.map(tagLabel).join(' ') : '';
    p._search = `${p.title || ''} ${p.board || ''} ${tagsText}`.toLowerCase();
  }

  const tree = manifest.tree;
  for (const year of Object.keys(tree)) {
    for (const schoolLevel of Object.keys(tree[year])) {
      for (const subject of Object.keys(tree[year][schoolLevel])) {
        for (const unit of Object.keys(tree[year][schoolLevel][subject])) {
          const tagObj = { curriculumYear: year, schoolLevel, subject, unit, confidence: 'high' };
          ALL_TAGGABLE.push({ label: reportTagLabel(tagObj), tag: tagObj });
        }
      }
    }
  }
  for (const [category, info] of Object.entries(CATEGORIES)) {
    for (const topic of info.topics) {
      const tagObj = { category, topic, confidence: 'high' };
      ALL_TAGGABLE.push({ label: reportTagLabel(tagObj), tag: tagObj });
    }
  }

  document.getElementById('searchInput').addEventListener('input', renderResults);
  renderResults();
  refreshPending();
  document.getElementById('pendingRefresh').addEventListener('click', refreshPending);
}

function renderResults() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const el = document.getElementById('results');
  const countEl = document.getElementById('resultCount');
  if (!q) { el.innerHTML = ''; countEl.textContent = '검색어를 입력하면 결과가 나옵니다.'; return; }
  const matched = posts.filter((p) => p._search.includes(q)).slice(0, 50);
  countEl.textContent = `${matched.length}건 표시 (최대 50건)`;
  el.innerHTML = matched.map((p) => {
    const tagsHtml = (p.tags || []).map((t) =>
      `<span class="tag-chip ${tagIsUnclassified(t)?'unclassified':''}">${escapeHtml(tagLabel(t))}</span>`
    ).join('');
    return `
      <div class="post-row" data-id="${p.id}">
        <button class="post-title-btn" data-postid="${p.id}">${escapeHtml(p.title)}</button>
        <div class="meta">${escapeHtml(p.board)} · ${escapeHtml(p.created)}${p.permlink ? ` · <a href="${escapeHtml(p.permlink)}" target="_blank" rel="noopener">원본</a>` : ''}</div>
        <div>${tagsHtml || '<span class="hint">태그 없음</span>'}</div>
        <button class="add-tag-btn" data-id="${p.id}">✏️ 태그 수정 제안</button>
        <div class="report-slot" data-id="${p.id}"></div>
      </div>
    `;
  }).join('');

  el.querySelectorAll('.post-title-btn').forEach((btn) => {
    btn.addEventListener('click', () => openPostModal(btn.dataset.postid));
  });
  el.querySelectorAll('.add-tag-btn').forEach((btn) => {
    btn.addEventListener('click', () => openReportForm(btn.dataset.id));
  });
}

// ---------------- 태그 수정 제안 폼 (추가/삭제 두 탭, explore.html의 제보 폼과 동일한 패턴) ----------------
const reportStates = new Map(); // postId -> { mode:'add'|'remove', checked:Map(key->tagObj), query:'' }

function openReportForm(postId) {
  reportStates.set(postId, { mode: 'add', checked: new Map(), query: '' });
  renderReportForm(postId);
}

function renderReportForm(postId) {
  const p = posts.find((x) => x.id === postId);
  const st = reportStates.get(postId);
  const slot = document.querySelector(`.report-slot[data-id="${postId}"]`);
  if (!p || !st || !slot) return;
  const existingTags = (p.tags || []).filter((t) => t.category !== '게시판별 분류');

  let bodyHtml;
  if (st.mode === 'add') {
    // 검색창은 매 입력마다 다시 그리지 않는다 — 한글 입력 중(조합 중)에 DOM을 갈아치우면
    // IME 조합이 끊겨서 자모가 풀어써진다. renderPicklist()가 picklist 부분만 따로 갱신한다.
    bodyHtml = `
      <input type="text" class="reportSearch" placeholder="태그 이름으로 검색... (예: 운동과 에너지, MBL센서)" value="${escapeHtml(st.query)}">
      <div class="report-picklist reportPicklistBox"></div>
      <div class="reportSelectedBox"></div>
      <input type="text" class="reportNewTag" placeholder="목록에 없는 태그를 새로 제안하고 싶다면 여기에 적어주세요">
    `;
  } else {
    bodyHtml = `
      <div class="report-picklist">
        ${existingTags.length ? existingTags.map((t) => `
          <label class="report-pick-item">
            <input type="checkbox" data-key='${escapeHtml(tagKey(t))}' ${st.checked.has(tagKey(t)) ? 'checked' : ''}>
            ${escapeHtml(reportTagLabel(t))}
          </label>`).join('') : `<div class="hint">이 글엔 제거할 태그가 없어요.</div>`}
      </div>
    `;
  }

  slot.innerHTML = `
    <div class="report-form">
      <div class="report-tabs">
        <button class="report-tab ${st.mode === 'add' ? 'active' : ''}" data-mode="add">➕ 태그 추가 제안</button>
        <button class="report-tab ${st.mode === 'remove' ? 'active' : ''}" data-mode="remove">🚫 태그 오류 제보</button>
      </div>
      ${bodyHtml}
      <textarea class="reportNote" placeholder="(선택) 추가 설명"></textarea>
      <div class="report-form-actions">
        <button class="submit reportSubmitBtn">제출</button>
        <button class="reportCancelBtn">취소</button>
      </div>
      <div class="report-form-status"></div>
    </div>
  `;

  slot.querySelectorAll('.report-tab').forEach((btn) => {
    btn.addEventListener('click', () => {
      st.mode = btn.dataset.mode;
      st.checked = new Map();
      st.query = '';
      renderReportForm(postId);
    });
  });
  if (st.mode === 'add') {
    renderPicklist(postId);
    const searchEl = slot.querySelector('.reportSearch');
    searchEl.addEventListener('input', (e) => { st.query = e.target.value; renderPicklist(postId); });
    searchEl.focus();
    searchEl.setSelectionRange(searchEl.value.length, searchEl.value.length);
  } else {
    slot.querySelectorAll('.report-pick-item input[type="checkbox"]').forEach((cb) => {
      cb.addEventListener('change', (e) => {
        const key = e.target.dataset.key;
        if (e.target.checked) st.checked.set(key, JSON.parse(key));
        else st.checked.delete(key);
        renderReportForm(postId);
      });
    });
  }
  slot.querySelector('.reportCancelBtn').addEventListener('click', () => { slot.innerHTML = ''; reportStates.delete(postId); });
  slot.querySelector('.reportSubmitBtn').addEventListener('click', () => submitAdminEdit(postId));
}

// add 모드의 검색 결과만 다시 그린다 — 검색창 <input> 자체는 절대 건드리지 않는다(IME 보존).
function renderPicklist(postId) {
  const st = reportStates.get(postId);
  const slot = document.querySelector(`.report-slot[data-id="${postId}"]`);
  if (!st || !slot) return;
  const box = slot.querySelector('.reportPicklistBox');
  const selBox = slot.querySelector('.reportSelectedBox');
  if (!box) return;
  const q = st.query.trim().toLowerCase();
  const matches = q ? ALL_TAGGABLE.filter((x) => x.label.toLowerCase().includes(q)).slice(0, 40) : [];
  box.innerHTML = matches.length ? matches.map((x) => `
    <label class="report-pick-item">
      <input type="checkbox" data-key='${escapeHtml(tagKey(x.tag))}' ${st.checked.has(tagKey(x.tag)) ? 'checked' : ''}>
      ${escapeHtml(x.label)}
    </label>`).join('') : `<div class="hint">${q ? '일치하는 태그가 없어요. 아래에 새로 제안해주세요.' : '검색어를 입력하면 목록이 나와요.'}</div>`;
  selBox.innerHTML = st.checked.size ? `<div class="report-selected">✅ 선택됨: ${[...st.checked.values()].map((t) => escapeHtml(reportTagLabel(t))).join(', ')}</div>` : '';
  box.querySelectorAll('input[type="checkbox"]').forEach((cb) => {
    cb.addEventListener('change', (e) => {
      const key = e.target.dataset.key;
      if (e.target.checked) st.checked.set(key, JSON.parse(key));
      else st.checked.delete(key);
      renderPicklist(postId);
    });
  });
}

async function submitAdminEdit(postId) {
  const p = posts.find((x) => x.id === postId);
  const st = reportStates.get(postId);
  const slot = document.querySelector(`.report-slot[data-id="${postId}"]`);
  const statusEl = slot.querySelector('.report-form-status');
  const note = slot.querySelector('.reportNote').value.trim();
  const newTagNote = st.mode === 'add' ? (slot.querySelector('.reportNewTag')?.value.trim() || '') : '';
  const checkedTags = [...st.checked.values()];
  const addTags = st.mode === 'add' ? checkedTags : [];
  const removeTags = st.mode === 'remove' ? checkedTags : [];

  if (!addTags.length && !removeTags.length && !newTagNote) {
    statusEl.textContent = '태그를 체크하거나 새 태그를 적어주세요.';
    return;
  }
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.startsWith('PASTE_')) {
    statusEl.textContent = '백엔드가 아직 연결되지 않았어요.';
    return;
  }
  statusEl.textContent = '보내는 중...';
  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'adminEdit', password: ADMIN_PASSWORD,
        postId, postTitle: p ? p.title : '', addTags, removeTags, newTagNote, note,
      }),
    });
    const data = await res.json();
    statusEl.textContent = data.ok ? '큐에 추가했습니다.' : '전송 실패: ' + (data.error || '알 수 없는 오류');
  } catch (err) {
    statusEl.textContent = '전송 실패: ' + err;
  }
}

// ---------------- 미처리 제보/수정 목록: 미리보기 + 수정 + 삭제 ----------------
let pendingCache = [];
function pendingKey(r) { return `${r._sheet}:${r._row}`; }

async function refreshPending() {
  const el = document.getElementById('pendingContent');
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.startsWith('PASTE_')) {
    el.textContent = '백엔드가 아직 연결되지 않았어요.';
    return;
  }
  el.textContent = '불러오는 중...';
  try {
    const url = `${APPS_SCRIPT_URL}?action=list&password=${encodeURIComponent(ADMIN_PASSWORD)}`;
    const data = await (await fetch(url)).json();
    if (!data.ok) { el.textContent = '불러오기 실패: ' + data.error; return; }
    pendingCache = [
      ...data.suggestions.map((r) => ({ ...r, _sheet: 'suggestions', _src: '제안' })),
      ...data.adminEdits.map((r) => ({ ...r, _sheet: 'adminEdits', _src: '관리자수정' })),
    ];
    renderPendingList();
  } catch (err) {
    el.textContent = '불러오기 실패: ' + err;
  }
}

function summarizePending(r) {
  const parts = [];
  if (r.addTags && r.addTags.length) parts.push('➕ ' + r.addTags.map(reportTagLabel).join(', '));
  if (r.removeTags && r.removeTags.length) parts.push('🚫 ' + r.removeTags.map(reportTagLabel).join(', '));
  if (r.newTagNote) parts.push('🆕 ' + r.newTagNote);
  if (r.note) parts.push('💬 ' + r.note);
  return parts.join(' / ') || '(내용 없음)';
}

function renderPendingList() {
  const el = document.getElementById('pendingContent');
  if (!pendingCache.length) { el.innerHTML = '미처리 항목 없음.'; return; }
  el.innerHTML = pendingCache.map((r) => {
    const key = pendingKey(r);
    return `
      <div class="pending-card">
        <div class="pending-meta">${escapeHtml(r._src)} · ${escapeHtml((r.timestamp || '').slice(0, 16))}</div>
        <button class="pending-title-btn" data-postid="${escapeHtml(r.postId)}">${escapeHtml(r.postTitle || r.postId)}</button>
        <div class="pending-summary">${escapeHtml(summarizePending(r))}</div>
        <div class="pending-actions">
          <button class="pending-edit-btn" data-key="${escapeHtml(key)}">✏️ 수정</button>
          <button class="pending-delete-btn" data-key="${escapeHtml(key)}">🗑 삭제</button>
        </div>
        <div class="report-slot pending-edit-slot" data-key="${escapeHtml(key)}"></div>
      </div>
    `;
  }).join('');

  el.querySelectorAll('.pending-title-btn').forEach((btn) => {
    btn.addEventListener('click', () => openPostModal(btn.dataset.postid));
  });
  el.querySelectorAll('.pending-edit-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const r = pendingCache.find((x) => pendingKey(x) === btn.dataset.key);
      if (r) openPendingForm(r);
    });
  });
  el.querySelectorAll('.pending-delete-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const r = pendingCache.find((x) => pendingKey(x) === btn.dataset.key);
      if (r) deletePending(r);
    });
  });
}

// ---------------- 대기열 항목 직접 수정(체크박스 picker 재사용) ----------------
const pendingStates = new Map(); // "sheet:row" -> { mode, checked:Map, query }

function openPendingForm(r) {
  const key = pendingKey(r);
  const mode = (r.removeTags && r.removeTags.length) ? 'remove' : 'add';
  const checked = new Map();
  (mode === 'add' ? (r.addTags || []) : (r.removeTags || [])).forEach((t) => checked.set(tagKey(t), t));
  pendingStates.set(key, { mode, checked, query: '' });
  renderPendingForm(r);
}

function renderPendingForm(r) {
  const key = pendingKey(r);
  const st = pendingStates.get(key);
  const slot = document.querySelector(`.pending-edit-slot[data-key="${key}"]`);
  if (!st || !slot) return;
  const post = posts.find((p) => p.id === r.postId);
  const existingTags = post ? (post.tags || []).filter((t) => t.category !== '게시판별 분류') : [];

  let bodyHtml;
  if (st.mode === 'add') {
    bodyHtml = `
      <input type="text" class="pendingSearch" placeholder="태그 이름으로 검색... (예: 운동과 에너지, MBL센서)" value="${escapeHtml(st.query)}">
      <div class="report-picklist pendingPicklistBox"></div>
      <div class="pendingSelectedBox"></div>
      <input type="text" class="pendingNewTag" placeholder="목록에 없는 태그를 새로 제안" value="${escapeHtml(r.newTagNote || '')}">
    `;
  } else {
    bodyHtml = `
      <div class="report-picklist">
        ${existingTags.length ? existingTags.map((t) => `
          <label class="report-pick-item">
            <input type="checkbox" data-key='${escapeHtml(tagKey(t))}' ${st.checked.has(tagKey(t)) ? 'checked' : ''}>
            ${escapeHtml(reportTagLabel(t))}
          </label>`).join('') : `<div class="hint">이 글의 현재 태그를 불러올 수 없어요.</div>`}
      </div>
    `;
  }

  slot.innerHTML = `
    <div class="report-form">
      <div class="report-tabs">
        <button class="report-tab ${st.mode === 'add' ? 'active' : ''}" data-mode="add">➕ 태그 추가</button>
        <button class="report-tab ${st.mode === 'remove' ? 'active' : ''}" data-mode="remove">🚫 태그 삭제</button>
      </div>
      ${bodyHtml}
      <textarea class="pendingNote" placeholder="(선택) 메모">${escapeHtml(r.note || '')}</textarea>
      <div class="report-form-actions">
        <button class="submit pendingSaveBtn">저장</button>
        <button class="pendingCancelBtn">취소</button>
      </div>
      <div class="report-form-status"></div>
    </div>
  `;

  slot.querySelectorAll('.report-tab').forEach((btn) => {
    btn.addEventListener('click', () => {
      st.mode = btn.dataset.mode;
      st.checked = new Map();
      st.query = '';
      renderPendingForm(r);
    });
  });
  if (st.mode === 'add') {
    renderPendingPicklist(r);
    const searchEl = slot.querySelector('.pendingSearch');
    searchEl.addEventListener('input', (e) => { st.query = e.target.value; renderPendingPicklist(r); });
    searchEl.focus();
    searchEl.setSelectionRange(searchEl.value.length, searchEl.value.length);
  } else {
    slot.querySelectorAll('.report-pick-item input[type="checkbox"]').forEach((cb) => {
      cb.addEventListener('change', (e) => {
        const k = e.target.dataset.key;
        if (e.target.checked) st.checked.set(k, JSON.parse(k));
        else st.checked.delete(k);
        renderPendingForm(r);
      });
    });
  }
  slot.querySelector('.pendingCancelBtn').addEventListener('click', () => { slot.innerHTML = ''; pendingStates.delete(key); });
  slot.querySelector('.pendingSaveBtn').addEventListener('click', () => savePendingEdit(r));
}

// add 모드의 검색 결과만 다시 그린다 — 검색창 <input> 자체는 절대 건드리지 않는다(IME 보존).
function renderPendingPicklist(r) {
  const key = pendingKey(r);
  const st = pendingStates.get(key);
  const slot = document.querySelector(`.pending-edit-slot[data-key="${key}"]`);
  if (!st || !slot) return;
  const box = slot.querySelector('.pendingPicklistBox');
  const selBox = slot.querySelector('.pendingSelectedBox');
  if (!box) return;
  const q = st.query.trim().toLowerCase();
  const matches = q ? ALL_TAGGABLE.filter((x) => x.label.toLowerCase().includes(q)).slice(0, 40) : [];
  box.innerHTML = matches.length ? matches.map((x) => `
    <label class="report-pick-item">
      <input type="checkbox" data-key='${escapeHtml(tagKey(x.tag))}' ${st.checked.has(tagKey(x.tag)) ? 'checked' : ''}>
      ${escapeHtml(x.label)}
    </label>`).join('') : `<div class="hint">${q ? '일치하는 태그가 없어요.' : '검색어를 입력하면 목록이 나와요.'}</div>`;
  selBox.innerHTML = st.checked.size ? `<div class="report-selected">✅ 선택됨: ${[...st.checked.values()].map((t) => escapeHtml(reportTagLabel(t))).join(', ')}</div>` : '';
  box.querySelectorAll('input[type="checkbox"]').forEach((cb) => {
    cb.addEventListener('change', (e) => {
      const k = e.target.dataset.key;
      if (e.target.checked) st.checked.set(k, JSON.parse(k));
      else st.checked.delete(k);
      renderPendingPicklist(r);
    });
  });
}

async function savePendingEdit(r) {
  const key = pendingKey(r);
  const st = pendingStates.get(key);
  const slot = document.querySelector(`.pending-edit-slot[data-key="${key}"]`);
  const statusEl = slot.querySelector('.report-form-status');
  const note = slot.querySelector('.pendingNote').value.trim();
  const newTagNote = st.mode === 'add' ? (slot.querySelector('.pendingNewTag')?.value.trim() || '') : '';
  const checkedTags = [...st.checked.values()];
  const addTags = st.mode === 'add' ? checkedTags : [];
  const removeTags = st.mode === 'remove' ? checkedTags : [];
  statusEl.textContent = '저장 중...';
  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'updateFeedback', password: ADMIN_PASSWORD, sheet: r._sheet, row: r._row, addTags, removeTags, newTagNote, note }),
    });
    const data = await res.json();
    if (data.ok) { statusEl.textContent = '저장했습니다.'; refreshPending(); }
    else statusEl.textContent = '저장 실패: ' + (data.error || '알 수 없는 오류');
  } catch (err) {
    statusEl.textContent = '저장 실패: ' + err;
  }
}

async function deletePending(r) {
  if (!confirm(`"${r.postTitle || r.postId}" 요청을 삭제할까요?\n(시트에는 기록이 남고, 대기 목록에서만 빠집니다)`)) return;
  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'deleteFeedback', password: ADMIN_PASSWORD, sheet: r._sheet, row: r._row }),
    });
    const data = await res.json();
    if (data.ok) refreshPending();
    else alert('삭제 실패: ' + (data.error || '알 수 없는 오류'));
  } catch (err) {
    alert('삭제 실패: ' + err);
  }
}
</script>
